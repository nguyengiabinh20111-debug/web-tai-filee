<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Tải Xuống - Delta Roblox</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #fff;
        }
        .card { 
            background: rgba(30, 41, 59, 0.9); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        h2 { 
            font-size: 24px; 
            margin-bottom: 8px; 
            color: #f8fafc;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }
        .select-group {
            margin-bottom: 22px;
        }
        .select-box { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 14px; 
            border: 1px solid #475569; 
            font-size: 15px; 
            background: #0f172a; 
            color: #fff;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .select-box:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .task-btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #ef4444, #dc2626); 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 14px; 
            width: 100%; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            text-decoration: none; 
            margin-bottom: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
        }
        .task-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
        }
        .task-btn.completed {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
        }
        .progress-container {
            margin: 20px 0;
            text-align: left;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ef4444;
            transition: width 0.4s ease, background 0.4s ease;
        }
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #475569;
            color: #94a3b8; 
            padding: 15px; 
            border: none; 
            border-radius: 14px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: not-allowed; 
            text-decoration: none; 
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: none;
        }
        .download-btn.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
        }
        .download-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(34, 197, 94, 0.6);
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="titleText">Delta Roblox</h2>
    <div class="subtitle">🔒 Hệ Thống Xác Thực Mở Khóa</div>

    <div class="select-group">
        <select id="versionSelect" class="select-box" onchange="updateInfo(this)">
            <option value="#" selected disabled>-- Chọn phiên bản Roblox --</option>
            <option value="https://drive.google.com/uc?export=download&id=16cFv0A1SlXkztIvPEyOHuGGEVGPvI_9m" data-name="Detail Roblox Quốc Tế">⚡ Detail Roblox Quốc Tế</option>
            <option value="https://drive.google.com/uc?export=download&id=1yhQR2953pHu_5U08WKR1Z4H8ZMHx9FoQ" data-name="Detail Roblox VNG">🔥 Detail Roblox VNG</option>
        </select>
    </div>

    <!-- Nút số 1: YouTube -->
    <a href="https://youtube.com/@congdongscript?si=wdPztpaB3mqr2izj" target="_blank" class="task-btn" id="ytBtn" onclick="completeTask('yt')">
        🔴 Nhấn vào để đăng ký kênh YouTube
    </a>

    <!-- Nút số 2: Discord -->
    <a href="https://discord.gg/dFGDzvChZ" target="_blank" class="task-btn" id="dcBtn" onclick="completeTask('dc')">
        💬 Nhấn vào để tham gia Discord
    </a>

    <!-- Thanh tiến trình -->
    <div class="progress-container">
        <div class="progress-info">
            <span>Tiến trình mở khóa</span>
            <span id="progressText">0/2 nhiệm vụ</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- Nút tải file -->
    <a id="downloadBtn" href="#" class="download-btn" onclick="checkDownload(event)">
        🔒 Hoàn thành nhiệm vụ để mở khóa
    </a>
</div>

<script>
    let ytDone = false;
    let dcDone = false;
    let selectedFileUrl = "#";

    function updateInfo(select) {
        var selectedOption = select.options[select.selectedIndex];
        var versionName = selectedOption.getAttribute("data-name");
        document.getElementById("titleText").innerText = versionName;
        selectedFileUrl = select.value;
    }

    function completeTask(type) {
        if(type === 'yt' && !ytDone) {
            ytDone = true;
            let yt = document.getElementById("ytBtn");
            yt.classList.add("completed");
            yt.innerHTML = "✅ Đã đăng ký kênh YouTube thành công";
        }
        if(type === 'dc' && !dcDone) {
            dcDone = true;
            let dc = document.getElementById("dcBtn");
            dc.classList.add("completed");
            dc.innerHTML = "✅ Đã tham gia Discord thành công";
        }

        updateProgress();
    }

    function updateProgress() {
        let count = (ytDone ? 1 : 0) + (dcDone ? 1 : 0);
        document.getElementById("progressText").innerText = count + "/2 nhiệm vụ";
        
        let percent = (count / 2) * 100;
        let bar = document.getElementById("progressBar");
        bar.style.width = percent + "%";

        if(count === 2) {
            bar.style.background = "#22c55e";
            let btn = document.getElementById("downloadBtn");
            btn.classList.add("active");
            btn.innerHTML = "🚀 Nhận Link Tải File Ngay";
        }
    }

    function checkDownload(e) {
        if(!ytDone || !dcDone) {
            e.preventDefault();
            alert("⚠️ Bạn chưa hoàn thành đủ 2 nhiệm vụ (Đăng ký YouTube và Tham gia Discord)!");
            return;
        }
        if(selectedFileUrl === "#") {
            e.preventDefault();
            alert("⚠️ Vui lòng chọn phiên bản Roblox ở menu phía trên trước nhé!");
            return;
        }
        window.location.href = selectedFileUrl;
    }
</script>

</body>
</html>
