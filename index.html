<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Tải Xuống - Delta Roblox</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #fff;
        }
        .card { 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        h2 { 
            font-size: 24px; 
            margin-bottom: 5px; 
            color: #f8fafc;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .select-group {
            margin-bottom: 20px;
        }
        .select-box { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid #475569; 
            font-size: 15px; 
            background: #0f172a; 
            color: #fff;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .select-box:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        .task-btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ef4444, #dc2626); 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
        }
        .task-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
        }
        .download-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            margin-top: 5px;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="titleText">Delta Roblox</h2>
    <div class="subtitle" id="subText">Kênh Cập Nhật Chính Thức</div>

    <div class="select-group">
        <select id="versionSelect" class="select-box" onchange="updateInfo(this)">
            <option value="#" selected disabled>-- Chọn phiên bản Roblox --</option>
            <option value="https://drive.google.com/uc?export=download&id=16cFv0A1SlXkztIvPEyOHuGGEVGPvI_9m" data-name="Detail Roblox Quốc Tế">⚡ Detail Roblox Quốc Tế</option>
            <option value="https://drive.google.com/uc?export=download&id=1yhQR2953pHu_5U08WKR1Z4H8ZMHx9FoQ" data-name="Detail Roblox VNG">🔥 Detail Roblox VNG</option>
        </select>
    </div>

    <!-- Nút YouTube -->
    <a href="https://youtube.com/@congdongscript?si=wdPztpaB3mqr2izj" target="_blank" class="task-btn">
        🔴 Nhấn vào để đăng ký kênh YouTube
    </a>

    <!-- Nút Discord -->
    <a href="https://discord.gg/dFGDzvChZ" target="_blank" class="task-btn">
        💬 Nhấn vào để tham gia Discord
    </a>

    <!-- Nút tải file -->
    <a id="downloadBtn" href="#" class="download-btn" onclick="if(this.getAttribute('href')==='#'){alert('Vui lòng chọn phiên bản Roblox ở trên trước nhé!'); return false;}">
        📥 Nhận File Tải Xuống
    </a>
</div>

<script>
    function updateInfo(select) {
        var selectedOption = select.options[select.selectedIndex];
        var versionName = selectedOption.getAttribute("data-name");
        
        // Đổi tiêu đề theo bản chọn
        document.getElementById("titleText").innerText = versionName;
        
        // Gán link tải vào nút bên dưới
        document.getElementById("downloadBtn").href = select.value;
    }
</script>

</body>
</html>
