<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải File Delta - Roblox</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #fff;
        }
        .card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        h2 { 
            font-size: 22px; 
            margin-bottom: 20px; 
            color: #f8fafc;
            font-weight: 600;
        }
        .select-group {
            position: relative;
            margin-bottom: 20px;
        }
        .select-box { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 10px; 
            border: 1px solid #475569; 
            font-size: 16px; 
            background: #0f172a; 
            color: #fff;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .select-box:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn:hover { 
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }
        .footer-note {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎮 Tải Xuống Delta Roblox</h2>
    <div class="select-group">
        <select id="versionSelect" class="select-box" onchange="document.getElementById('downloadBtn').href = this.value;">
            <option value="#" selected disabled>-- Chọn phiên bản Roblox --</option>
            <option value="https://drive.google.com/uc?export=download&id=16cFv0A1SlXkztIvPEyOHuGGEVGPvI_9m">⚡ Delta - Roblox Quốc Tế</option>
            <option value="https://drive.google.com/uc?export=download&id=1yhQR2953pHu_5U08WKR1Z4H8ZMHx9FoQ">🔥 Delta - Roblox VNG</option>
        </select>
    </div>
    <a id="downloadBtn" href="#" class="btn" onclick="if(this.getAttribute('href')==='#'){alert('Vui lòng chọn phiên bản trước khi tải nhé!'); return false;}">Tải Xuống Ngay</a>
    <div class="footer-note">Giao diện độc quyền & mượt mà</div>
</div>

</body>
</html>
