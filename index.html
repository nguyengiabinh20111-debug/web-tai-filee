<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Tải Xuống - Delta Roblox</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #fff;
        }
        .card { 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        h2 { 
            font-size: 24px; 
            margin-bottom: 5px; 
            color: #f8fafc;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .select-group {
            margin-bottom: 20px;
        }
        .select-box { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid #475569; 
            font-size: 15px; 
            background: #0f172a; 
            color: #fff;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .task-btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ef4444, #dc2626); 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            margin-bottom: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
        }
        .task-btn.completed {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
        }
        .progress-text {
            font-size: 13px;
            color: #94a3b8;
            margin: 15px 0 10px 0;
        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ef4444;
            transition: width 0.4s ease, background 0.4s ease;
        }
        .download-btn {
            background: #475569;
            color: #94a3b8; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: not-allowed; 
            text-decoration: none; 
            display: inline-block; 
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .download-btn.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
        }
        .download-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="titleText">Delta Roblox</h2>
    <div class="subtitle">Kênh Cập Nhật Chính Thức</div>

    <div class="select-group">
        <select id="versionSelect" class="select-box" onchange="updateInfo(this)">
            <option value="#" selected disabled>-- Chọn phiên bản Roblox --</option>
            <option value="https://drive.google.com/uc?export=download&id=16cFv0A1SlXkztIvPEyOHuGGEVGPvI_9m" data-name="Detail Roblox Quốc Tế">⚡ Detail Roblox Quốc Tế</option>
            <option value="https://drive.google.com/uc?export=download&id=1yhQR2953pHu_5U08WKR1Z4H8ZMHx9FoQ" data-name="Detail Roblox VNG">🔥 Detail Roblox VNG</option>
        </select>
    </div>

    <!-- Nút 1: YouTube -->
    <a href="https://youtube.com/@congdongscript?si=wdPztpaB3mqr2izj" target="_blank" class="task-btn" id="ytBtn" onclick="completeTask('yt')">
        🔴 Nhấn vào để đăng ký kênh YouTube
    </a>

    <!-- Nút 2: Discord -->
    <a href="https://discord.gg/dFGDzvChZ" target="_blank" class="task-btn" id="dcBtn" onclick="completeTask('dc')">
        💬 Nhấn vào để tham gia Discord
    </a>

    <!-- Tiến trình -->
    <div class="progress-text" id="progressText">Tiến trình mở khoá: 0/2</div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Nút tải file (Bị khóa ban đầu) -->
    <a id="downloadBtn" href="#" class="download-btn" onclick="checkDownload(event)">
        📥 Nhận File Tải Xuống
    </a>
</div>

<script>
    let ytDone = false;
    let dcDone = false;
    let selectedFileUrl = "#";

    function updateInfo(select) {
        var selectedOption = select.options[select.selectedIndex];
        var versionName = selectedOption.getAttribute("data-name");
        document.getElementById("titleText").innerText = versionName;
        selectedFileUrl = select.value;
    }

    function completeTask(type) {
        if(type === 'yt' && !ytDone) {
            ytDone = true;
            document.getElementById("ytBtn").classList.add("completed");
            document.getElementById("ytBtn").innerHTML = "✅ Đã đăng ký kênh YouTube";
        }
        if(type === 'dc' && !dcDone) {
            dcDone = true;
            document.getElementById("dcBtn").classList.add("completed");
            document.getElementById("dcBtn").innerHTML = "✅ Đã tham gia Discord";
        }

        updateProgress();
    }

    function updateProgress() {
        let count = (ytDone ? 1 : 0) + (dcDone ? 1 : 0);
        document.getElementById("progressText").innerText = "Tiến trình mở khoá: " + count + "/2";
        
        let percent = (count / 2) * 100;
        let bar = document.getElementById("progressBar");
        bar.style.width = percent + "%";

        if(count === 2) {
            bar.style.background = "#22c55e";
            let btn = document.getElementById("downloadBtn");
            btn.classList.add("active");
            btn.innerText = "🚀 Tải Xuống Ngay";
        }
    }

    function checkDownload(e) {
        if(!ytDone || !dcDone) {
            e.preventDefault();
            alert("Vui lòng hoàn thành đăng ký YouTube và tham gia Discord trước để mở khóa nút tải!");
            return;
        }
        if(selectedFileUrl === "#") {
            e.preventDefault();
            alert("Vui lòng chọn phiên bản Roblox ở trên trước nhé!");
            return;
        }
        // Cho phép chuyển hướng tải file
        window.location.href = selectedFileUrl;
    }
</script>

</body>
</html>
